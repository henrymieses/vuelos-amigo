<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de vuelos</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --ok-bg: #e8f5ee; --ok-text: #1a7f4b;
    --warn-bg: #fdecec; --warn-text: #c0281c;
    --neutral-bg: #eef1f5; --neutral-text: #4b5563;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --border: #2a2e37;
      --accent: #6ea8fe;
      --ok-bg: #12301f; --ok-text: #5fd695;
      --warn-bg: #3a1414; --warn-text: #ff8a80;
      --neutral-bg: #23272f; --neutral-text: #b4bac4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 32px 24px;
    max-width: 1000px;
    margin: 0 auto;
  }
  header svg { flex-shrink: 0; }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px 48px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .flight-number { font-size: 1.4rem; font-weight: 700; }
  .airline-name { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }

  .badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge.neutral { background: var(--neutral-bg); color: var(--neutral-text); }

  .info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--text);
  }
  .info-row svg { flex-shrink: 0; opacity: 0.6; }
  .info-label { color: var(--muted); }

  .updated {
    font-size: 0.75rem;
    color: var(--muted);
  }

  .live-link {
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .live-link:hover { text-decoration: underline; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
</style>
</head>
<body>

<header>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2.5 2v1.5L12 21l4.5 1.5V21L14 19v-5.5l7 2.5z" fill="currentColor" opacity="0.85"/>
  </svg>
  <div>
    <h1>Estado de vuelos</h1>
    <p>Se actualiza automáticamente cada 30 minutos</p>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <p id="emptyState" class="empty-state" style="display:none">No hay datos de vuelos todavía.</p>
</main>

<script>
  const AIRLINES = {
    AA: 'American Airlines', DL: 'Delta Air Lines', UA: 'United Airlines',
    IB: 'Iberia', AV: 'Avianca', LA: 'LATAM', CM: 'Copa Airlines',
    B6: 'JetBlue', WN: 'Southwest', BA: 'British Airways', AF: 'Air France',
    LH: 'Lufthansa', KL: 'KLM', AM: 'Aeroméxico'
  };

  function statusBadgeClass(status) {
    if (status === 'Delayed' || status === 'Cancelled' || status === 'Diverted') return 'warn';
    if (status === 'Landed' || status === 'Arrived' || status === 'Departed') return 'ok';
    return 'neutral';
  }

  function statusLabel(status) {
    const map = {
      Expected: 'Programado', Delayed: 'Retrasado', Departed: 'En vuelo',
      EnRoute: 'En vuelo', Landed: 'Aterrizó', Arrived: 'Llegó',
      Cancelled: 'Cancelado', Diverted: 'Desviado', Unknown: 'Sin datos'
    };
    return map[status] || status;
  }

  function airlineName(flightNumber) {
    const code = flightNumber.slice(0, 2).toUpperCase();
    return AIRLINES[code] || code;
  }

  function timeIconSvg() {
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  }

  fetch('data/flights.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      const grid = document.getElementById('grid');
      if (!data.length) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      data.forEach(f => {
        const card = document.createElement('div');
        card.className = 'card';
        const badgeClass = statusBadgeClass(f.status);
        const liveUrl = `https://www.flightaware.com/live/flight/${encodeURIComponent(f.flightNumber)}`;
        card.innerHTML = `
          <div class="card-top">
            <div>
              <div class="flight-number">${f.flightNumber}</div>
              <div class="airline-name">${airlineName(f.flightNumber)}</div>
            </div>
            <span class="badge ${badgeClass}">${statusLabel(f.status)}</span>
          </div>
          <div class="info-row">${timeIconSvg()}<span class="info-label">Programado:</span> ${f.scheduledTime}</div>
          <div class="info-row">${timeIconSvg()}<span class="info-label">Estimado/Real:</span> ${f.estimatedTime || '-'}</div>
          <div class="updated">Actualizado: ${new Date(f.updatedAt).toLocaleString('es')}</div>
          <a class="live-link" href="${liveUrl}" target="_blank" rel="noopener">
            Ver estado en vivo →
          </a>
        `;
        grid.appendChild(card);
      });
    });

  // refresca la página cada 5 min para reflejar cambios sin recargar a mano
  setTimeout(() => location.reload(), 5 * 60 * 1000);
</script>

</body>
</html>
