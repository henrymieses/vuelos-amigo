name: Check Flights

on:
  schedule:
    # Cada hora, 5am-medianoche hora de Nueva York (actualmente EDT, UTC-4 -> 9am-4am UTC).
    # OJO: en horario estandar (EST, desde nov) la ventana local se corre 1 hora, hay que ajustar el cron entonces.
    - cron: '0 0-3,9-23 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Enviar un correo de PRUEBA (no revisa vuelos reales)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-flights.js
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEST_EMAIL: ${{ secrets.DEST_EMAIL }}
          FLIGHT_NUMBERS: ${{ vars.FLIGHT_NUMBERS }}
          TEST_MODE: ${{ github.event.inputs.test_email || 'false' }}
      - name: Commit updated data
        run: |
          git config user.name "flight-bot"
          git config user.email "actions@github.com"
          git add data/flights.json
          git diff --cached --quiet || git commit -m "Actualiza estado de vuelos"
          git push
